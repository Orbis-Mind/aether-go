name: mybot
version: "1.0.0"
description: "A new Aether AI agent"

policy:
  max_cost_per_run: 0.05
  quality: balanced
  latency: balanced
  max_retries: 3

memory:
  semantic: true
  long_term: false
  entity: false
  relationship: false
  ttl_seconds: 86400

tools: []

prompts:
  system: |
    You are a helpful, accurate, and concise AI assistant.
    Always provide clear and actionable responses.

  user_template: |
    {user_message}
